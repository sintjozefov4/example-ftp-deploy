on:
  push:
    branches:
      - main
name: 🚀 Deploy website on push
jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v6
    
    - name: 📂 Sync files
      uses: SamKirkland/FTP-Deploy-Action@v4.4.0
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: public_html/    # indien nodig aanpassen naar de publieke map op de betreffende server
        local-dir: ./               # momenteel de lokale root folder, indien nodig aanpassen naar folder waar de website lokaal in staat
        exclude: |
          **/.git
          **/.git/**
          **/.github
          **/.github/**
          **/.gitignore
          **/README.md
          **/AGENTS.md
